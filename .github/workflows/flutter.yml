name: Flutter (Android + iPhone)

on:
  push:
    branches: [main, "claude/**"]
    paths: ["mobile/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      # The offline voices' tests run the real models (skipped if they cannot be fetched): ONNX
      # Runtime for Linux under the name the plugin loads, and the same models as the Android app.
      - uses: actions/cache@v4
        with:
          path: ~/ort
          key: onnxruntime-linux-x64-1.23.2
      - name: ONNX Runtime for the voice tests
        run: |
          mkdir -p ~/ort && cd ~/ort
          lib=onnxruntime-linux-x64-1.23.2/lib/libonnxruntime.so.1.23.2
          if [ -s "$lib" ] || { curl -fsSL --retry 5 --retry-all-errors -o ort.tgz \
               https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz &&
             tar xzf ort.tgz && rm -f ort.tgz; }; then
            ln -sf "$PWD/$lib" libonnxruntime.so.1.22.0
            echo "LD_LIBRARY_PATH=$HOME/ort" >> "$GITHUB_ENV"
            echo "ORT_READY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ONNX Runtime unavailable; the model tests are skipped"; rm -rf ./*
          fi
      - uses: actions/cache@v4
        with:
          path: ~/voice-models
          key: voice-models-renikud-a59c632-noa-23f8e06
      - name: Fetch offline voice models
        run: |
          mkdir -p ~/voice-models && cd ~/voice-models
          fetch() { [ -s "$1" ] || curl -fsSL --retry 3 -o "$1" "$2"; }
          noa=https://huggingface.co/thewh1teagle/piper-he-noa/resolve/23f8e06909e9a1e562a50f99df63e3785451379a
          if [ -n "$ORT_READY" ] && fetch renikud.onnx https://huggingface.co/renikud/renikud/resolve/a59c632c8cbac0f8c63f298cad77ef3a3a2547c9/model.onnx &&
             fetch he_IL-noa-medium.onnx "$noa/he_IL-noa-medium.onnx" &&
             fetch he_IL-noa-medium.onnx.json "$noa/he_IL-noa-medium.onnx.json" &&
             sha256sum -c <<'SUMS'
          8b881a3a8f00283d86c6d1feea44d37e09c1ea6609a4de7d820d937e7f3dbbca  renikud.onnx
          83b18c0b8fad6ac00fcea5c5bdf3c1fdbec182f9eadad9f97bc423ab4e22be7d  he_IL-noa-medium.onnx
          109a7a2a0739061510f318d987e81c27ba81ca57c9303444298f712f71b1082c  he_IL-noa-medium.onnx.json
          SUMS
          then echo "VOICE_MODELS_DIR=$HOME/voice-models" >> "$GITHUB_ENV"
          else echo "::warning::Voice models unavailable; the model tests are skipped"; rm -f ./*
          fi
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Optional: the same signing secrets as the native Android workflow.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # ARM phones (practically all of them), as the native app: x86 would add ~45 MB.
        run: flutter build apk --release --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: read-aloud-flutter-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Unsigned build: sideload it with SideStore / AltStore / Sideloadly, which sign it with
      # your own (free) Apple ID on install. See mobile/README.md.
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          # The offline voices reach ONNX Runtime through the app's own symbols.
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep -q ' _OrtGetApiBase$' ||
            { echo "::error::ONNX Runtime is not exported from the app binary"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry ReadAloud-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: read-aloud-ios-unsigned-ipa
          path: mobile/build/ipa/ReadAloud-unsigned.ipa

      # Optional TestFlight upload, only when an Apple Developer account's secrets are set:
      # APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_PRIVATE_KEY (App Store Connect
      # API key, .p8 contents) and APPLE_TEAM_ID. Xcode then signs automatically with the key.
      - name: Signed build for TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        if: env.KEY_ID != ''
        run: |
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/export.plist" \
            --build-number=${{ github.run_number }} \
            -- -allowProvisioningUpdates \
               -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
               -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
               DEVELOPMENT_TEAM="$TEAM_ID"
